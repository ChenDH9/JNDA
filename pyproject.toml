[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jnda-segmentation"
version = "1.0.0"
description = "Native adaptation of a generative vision backbone for crop and weed segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{name = "JNDA authors"}]
dependencies = [
    "numpy==2.4.6",
    "Pillow==12.3.0",
    "PyYAML==6.0.3",
    "scipy==1.17.1",
]

[project.urls]
Repository = "https://github.com/ChenDH9/JNDA"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jnda*", "researchos*"]
namespaces = true
